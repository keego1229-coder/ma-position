<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移動平均チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e8edf1;
    --card: #ffffff;
    --ink: #16202b;
    --muted: #6b7a88;
    --rule: #d4dce4;
    --up: #c8102e;
    --down: #1668a8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 16px 56px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  .num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---- ヘッダー ---- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 20px;
  }
  .masthead h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .stamp { font-size: 11px; color: var(--muted); text-align: right; }

  /* ---- カード ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .ticker { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  .name { font-size: 15px; font-weight: 700; margin-top: 1px; }
  .price { text-align: right; white-space: nowrap; }
  .price .close { font-size: 22px; font-weight: 700; }
  .price .chg { font-size: 12px; font-weight: 500; margin-top: 2px; }

  .spark { display: block; width: 92px; height: 26px; margin-top: 4px; }

  /* ---- 判定 ---- */
  .verdict {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 14px 0 4px;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .note { font-size: 12px; color: var(--muted); }

  /* ---- 乖離ゲージ（この画面の主役） ---- */
  .gauge { margin-top: 12px; }
  .row {
    display: grid;
    grid-template-columns: 62px 1fr 62px;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .row .label { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .row .label b { display: block; font-weight: 500; color: var(--ink); }
  .track {
    position: relative;
    height: 16px;
    background: linear-gradient(var(--rule), var(--rule)) center / 1px 100% no-repeat;
  }
  .track::after {
    content: "";
    position: absolute;
    inset: 50% 0 auto 0;
    border-top: 1px dashed #eaeff4;
  }
  .fill {
    position: absolute;
    top: 3px;
    height: 10px;
    border-radius: 2px;
    transition: width 0.5s ease-out;
  }
  .row .val { font-size: 12px; text-align: right; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .fill.up { background: var(--up); left: 50%; }
  .fill.down { background: var(--down); right: 50%; }

  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    padding: 4px 62px 0 62px;
  }

  /* ---- 空・エラー ---- */
  .msg {
    background: var(--card);
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    padding: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .msg strong { color: var(--ink); display: block; margin-bottom: 4px; }

  .foot {
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>移動平均チェック</h1>
    <div class="stamp" id="stamp">読み込み中…</div>
  </header>

  <main id="list">
    <div class="msg">データを読み込んでいます…</div>
  </main>

  <p class="foot">
    5日・25日・75日の単純移動平均。バーは終値の乖離率で、右（赤）は線の上、左（青）は線の下。
    株価データは Yahoo Finance 由来のため参考値です。売買の判断はご自身でどうぞ。
  </p>
</div>

<script>
const MAX_DEV = 10; // ゲージの端 = ±10%

function fmtNum(n, digits = 1) {
  return n == null ? "–" : n.toLocaleString("ja-JP", {
    minimumFractionDigits: digits, maximumFractionDigits: digits
  });
}

function signed(n) {
  return (n > 0 ? "+" : "") + fmtNum(n, 2) + "%";
}

function sparkline(values) {
  if (!values || values.length < 2) return "";
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 92;
    const y = 24 - ((v - min) / span) * 22;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const rising = values[values.length - 1] >= values[0];
  const color = rising ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 92 26" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4"
      stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>
  </svg>`;
}

function gaugeRow(period, ma, dev) {
  const label = `<span class="label">${period}日<b class="num">${fmtNum(ma, 1)}</b></span>`;
  if (dev == null) {
    return `<div class="row">${label}<div class="track"></div><span class="val num">–</span></div>`;
  }
  const dir = dev >= 0 ? "up" : "down";
  const width = Math.min(Math.abs(dev) / MAX_DEV, 1) * 50;
  return `<div class="row">
    ${label}
    <div class="track"><div class="fill ${dir}" style="width:${width.toFixed(1)}%"></div></div>
    <span class="val num ${dir}">${signed(dev)}</span>
  </div>`;
}

function crossText(cross) {
  if (!cross) return "";
  const cls = cross.type === "ゴールデンクロス" ? "up" : "down";
  return `<span class="note">直近の5日×25日：<span class="${cls}">${cross.type}</span>（${cross.date} / ${cross.bars_ago}営業日前）</span>`;
}

function card(s) {
  const chgCls = s.change_pct >= 0 ? "up" : "down";
  const posCls = s.position.includes("すべての上") ? "up"
               : s.position.includes("すべての下") ? "down" : "";
  const orderBadge = s.order
    ? `<span class="badge ${s.order.startsWith("上昇") ? "up" : "down"}">${s.order}</span>`
    : "";

  return `<article class="card">
    <div class="card-top">
      <div>
        <div class="ticker num">${s.code}</div>
        <div class="name">${s.name}</div>
        ${sparkline(s.spark)}
      </div>
      <div class="price">
        <div class="close num">${fmtNum(s.close, 1)}</div>
        <div class="chg num ${chgCls}">${signed(s.change_pct)}</div>
        <div class="ticker num">${s.date}</div>
      </div>
    </div>

    <div class="verdict">
      <span class="badge ${posCls}">${s.position}</span>
      ${orderBadge}
    </div>
    ${crossText(s.cross)}

    <div class="gauge">
      ${[5, 25, 75].map(p => gaugeRow(p, s.ma[p], s.dev[p])).join("")}
      <div class="scale"><span>−${MAX_DEV}%</span><span>0</span><span>+${MAX_DEV}%</span></div>
    </div>
  </article>`;
}

async function load() {
  const list = document.getElementById("list");
  const stamp = document.getElementById("stamp");
  try {
    const res = await fetch("data/ma.json?" + Date.now());
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    stamp.textContent = data.generated_at;

    if (!data.stocks.length) {
      list.innerHTML = `<div class="msg"><strong>まだ銘柄がありません</strong>
        watchlist.json に銘柄コードを追加して、Actions を実行してください。</div>`;
      return;
    }

    list.innerHTML = data.stocks.map(card).join("")
      + (data.errors.length
        ? `<div class="msg"><strong>取得できなかった銘柄</strong>
           ${data.errors.map(e => `${e.code} ${e.name}：${e.message}`).join("<br>")}</div>`
        : "");
  } catch (e) {
    stamp.textContent = "—";
    list.innerHTML = `<div class="msg"><strong>データがまだありません</strong>
      GitHub の Actions タブから「移動平均データ更新」を一度手動で実行すると表示されます。</div>`;
  }
}

load();
</script>
</body>
</html>
