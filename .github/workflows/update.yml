name: 移動平均データ更新

on:
  schedule:
    # 08:10 UTC = 平日17:10 JST（東証の引け後）
    - cron: "10 8 * * 1-5"
  workflow_dispatch: # 手動実行用のボタンが Actions タブに出ます

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install yfinance

      - name: 日足を取得して判定
        run: python scripts/fetch_ma.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ma.json
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "移動平均データを更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git push
          fi
